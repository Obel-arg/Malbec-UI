name: Publish to GitHub Packages

# The version is bumped inside the change PR (see ci.yml `release-check`).
# On every push to main: if package.json's version has no tag yet, build,
# publish, and create the GitHub Release (which also creates the tag).
# A push whose version is already tagged is a no-op.
#
# Manual recovery: run from the Actions tab; it publishes package.json's
# version on main if it is still untagged.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect untagged version
        id: version
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "${VERSION} is already tagged; nothing to publish."
            exit 0
          fi
          echo "Will publish ${VERSION}."
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # Release body = this version's CHANGELOG section.
          awk -v v="$VERSION" '
            /^## / { inside = ($2 == v) ; next }
            inside
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"

      - name: Setup pnpm
        if: steps.version.outputs.version
        uses: pnpm/action-setup@v4

      - name: Setup Node
        if: steps.version.outputs.version
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: https://npm.pkg.github.com
          scope: '@obel-arg'

      - name: Install dependencies
        if: steps.version.outputs.version
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.version.outputs.version
        run: pnpm build

      - name: Publish to GitHub Packages
        if: steps.version.outputs.version
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Tag only after a successful publish, so a failed publish can be re-run.
      - name: Create tag and GitHub Release
        if: steps.version.outputs.version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.version }}
          body_path: ${{ runner.temp }}/notes.md
