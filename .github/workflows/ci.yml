name: CI

on:
  pull_request:
    branches:
      - main
      - 'release/**'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (typecheck + bundle)
        run: pnpm build

      - name: Smoke-test the published entry points
        run: node scripts/smoke-exports.mjs

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Release check self-test
        run: scripts/release-check.test.sh

      # Sub-PRs into a release/** branch ship together: the version is bumped
      # once, in the PR from release/** to main.
      - name: Release check
        if: github.base_ref == 'main'
        run: scripts/release-check.sh "origin/${{ github.base_ref }}"
