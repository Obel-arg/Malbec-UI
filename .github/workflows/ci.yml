name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (typecheck + bundle)
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Release check self-test
        run: scripts/release-check.test.sh

      - name: Release check
        run: scripts/release-check.sh "origin/${{ github.base_ref }}"
